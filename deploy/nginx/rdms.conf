# Install: sudo cp deploy/nginx/rdms.conf /etc/nginx/sites-available/rdms
# Enable:  sudo ln -s /etc/nginx/sites-available/rdms /etc/nginx/sites-enabled/
# TLS:     sudo certbot --nginx -d rdms.example.com
# Test:    sudo nginx -t && sudo systemctl reload nginx
#
# Replace rdms.example.com with your domain before enabling.

server {
    listen 80;
    server_name rdms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rdms.example.com;

    ssl_certificate     /etc/letsencrypt/live/rdms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rdms.example.com/privkey.pem;

    root /var/www/rdms/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /swagger-ui.html { return 404; }
    location /v3/api-docs     { return 404; }
}
