spring.application.name=rdms

# Server
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siwarga}
spring.datasource.username=${DB_USER:siwarga}
spring.datasource.password=${DB_PASS:siwarga}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
rdms.jwt.secret=${JWT_SECRET:change-me-in-prod-this-is-a-dev-only-secret-key-min-256-bits!!}
rdms.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}

# Default admin (seeded on startup if no users exist)
rdms.admin.username=${ADMIN_USERNAME:admin}
rdms.admin.password=${ADMIN_PASSWORD:admin123}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Multipart (CSV import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
