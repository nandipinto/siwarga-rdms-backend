spring.application.name=rdms

# Server
server.port=${SERVER_PORT:8080}

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siwarga}
spring.datasource.username=${DB_USER:siwarga}
spring.datasource.password=${DB_PASS:Rahas1ad0nk!}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
rdms.jwt.secret=${JWT_SECRET:720bc5baf9585966cb9e14c51eb4f2f8f77af1adf77aa0009ed5782f27bca4f7}
rdms.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}

# Default admin (seeded on startup if no users exist)
rdms.admin.username=${ADMIN_USERNAME:admin}
rdms.admin.password=${ADMIN_PASSWORD:Rahas1ad0nk!}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Multipart (CSV import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Rental guarantee (spec §3.6)
rdms.rental-guarantee.min-duration-months=6
rdms.rental-guarantee.default-amount-idr=300000
rdms.rental-guarantee.receipt-prefix=RG
rdms.rental-guarantee.refund-prefix=RF
