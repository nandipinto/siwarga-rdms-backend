services:
  db:
    image: postgres:16-alpine
    container_name: siwarga-db
    environment:
      POSTGRES_DB: siwarga
      POSTGRES_USER: siwarga
      POSTGRES_PASSWORD: Rahas1ad0nk!
    ports:
      - "5432:5432"
    volumes:
      - siwarga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siwarga -d siwarga"]
      interval: 10s
      timeout: 5s
      retries: 5

