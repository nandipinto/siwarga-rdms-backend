services:
  db:
    image: postgres:16-alpine
    container_name: siwarga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siwarga}
      POSTGRES_USER: ${DB_USER:-siwarga}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - siwarga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: siwarga-rdms:latest
    container_name: siwarga-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-siwarga}
      DB_USER: ${DB_USER:-siwarga}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-Xmx768m -Xms256m"
    depends_on:
      db:
        condition: service_healthy

volumes:
  siwarga-data:
